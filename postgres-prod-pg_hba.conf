# VengaiCode production pg_hba.conf — SSL-only for every network connection.
#
# `hostssl` (not `host`) on every remote/loopback line means the server
# itself REJECTS a plaintext connection attempt outright, instead of just
# accepting whatever the client happens to request. This is the
# server-side half of the SSL requirement — apps/backend/app/core/
# database.py's connect_args={"ssl": "require"} is the client-side half.
# The `local` line (Unix socket, same machine only) stays as-is since it
# never touches the network.
#
# TYPE    DATABASE  USER  ADDRESS       METHOD
local     all       all                 trust
hostssl   all       all   127.0.0.1/32  scram-sha-256
hostssl   all       all   ::1/128       scram-sha-256
hostssl   all       all   0.0.0.0/0     scram-sha-256
