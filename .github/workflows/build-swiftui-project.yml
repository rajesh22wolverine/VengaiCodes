# ═══════════════════════════════════════════════════════════════
#  VengaiCode — SwiftUI Project Build (per-project)
#
#  Turns the generated SwiftUI screens + XcodeGen project.yml (see
#  app/ai/codegen/frontend/swiftui.py) into a real .xcodeproj via
#  `xcodegen generate`, then proves it actually compiles with a real
#  `xcodebuild build` against an iOS Simulator destination — no signing
#  identity involved (CODE_SIGNING_ALLOWED=NO), so this needs nothing
#  from the end user's own Apple Developer account. Runs on macos-latest,
#  which ships Xcode preinstalled; free on GitHub-hosted runners for a
#  public repo regardless of OS.
#
#  HONEST CEILING: this verifies a SIMULATOR build compiles. It does NOT
#  produce a signed, device-installable .ipa — that needs the end user's
#  own Apple Developer account/certificates/provisioning profile, which
#  VengaiCode has no access to. The zip this uploads is the real source +
#  generated .xcodeproj, meant to be opened in Xcode and signed locally.
#
#  Triggered via: repository_dispatch event type
#  "build-swiftui-project-app" with client_payload: { "project_id": "..." }
#
#  HONEST STATUS: written but UNTESTED end-to-end — no macOS runner run
#  has ever been triggered. `xcodegen` and `xcodebuild` are both real,
#  standard tools; what's unverified is this exact project.yml shape
#  against whatever Xcode version ships on the macos-latest image at
#  run time.
# ═══════════════════════════════════════════════════════════════

name: Build SwiftUI Project
run-name: "SwiftUI project build — ${{ github.event.client_payload.project_id }}"

on:
  repository_dispatch:
    types: [build-swiftui-project-app]

jobs:
  build-swiftui-project:
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch generated project files from VengaiCode backend
        shell: bash
        env:
          PROJECT_ID: ${{ github.event.client_payload.project_id }}
          BUILD_SECRET: ${{ secrets.VENGAICODE_BUILD_SECRET }}
          BACKEND_URL: https://vengaicode-backend.onrender.com
        run: |
          echo "Fetching files for project $PROJECT_ID"
          curl -f -H "X-Build-Secret: $BUILD_SECRET" \
            "$BACKEND_URL/api/v1/packaging/$PROJECT_ID/files" \
            -o project_files.json
          echo "Fetched project_files.json"

      - name: Extract SwiftUI project into build/
        shell: bash
        run: |
          mkdir -p build
          python3 .github/scripts/extract_swiftui_project.py

      - name: Verify project.yml is present
        working-directory: build
        shell: bash
        run: |
          if [ ! -f project.yml ]; then
            echo "project.yml NOT FOUND — was this project really generated with the swiftui frontend?"
            exit 1
          fi
          echo "Files inside build:"
          find . -maxdepth 2 -type f

      - name: Install XcodeGen
        shell: bash
        run: brew install xcodegen

      - name: Generate the real .xcodeproj
        working-directory: build
        shell: bash
        run: |
          xcodegen generate
          echo "Generated project:"
          ls -d *.xcodeproj

      - name: Show selected Xcode
        shell: bash
        run: xcode-select -p && xcodebuild -version

      - name: Build for the iOS Simulator (no code signing)
        working-directory: build
        shell: bash
        run: |
          XCODEPROJ=$(ls -d *.xcodeproj | head -n1)
          SCHEME="${XCODEPROJ%.xcodeproj}"
          echo "Building $XCODEPROJ, scheme $SCHEME"
          set -o pipefail
          xcodebuild build \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee ../xcodebuild.log

      - name: Zip the built, verified project (source + real .xcodeproj)
        if: success()
        shell: bash
        run: |
          mkdir -p dist
          SAFE_NAME=$(python3 -c "
          import json, re
          data = json.load(open('project_files.json', encoding='utf-8'))
          name = data.get('project_name') or 'vengaicode_swiftui_project'
          cleaned = re.sub(r'[^\w\s-]', '', name).strip()
          cleaned = re.sub(r'\s+', '_', cleaned)
          print((cleaned[:50] or 'vengaicode_swiftui_project'))
          ")
          cd build
          zip -r "../dist/${SAFE_NAME}-swiftui-xcodeproj.zip" . -x "DerivedData/*"

      - name: Upload build log (always, even on failure — for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

      - name: Upload built project artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vengaicode-app-swiftui-xcodeproj
          path: dist/*.zip
          if-no-files-found: error
