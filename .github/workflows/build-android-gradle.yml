# ═══════════════════════════════════════════════════════════════
#  VengaiCode — Android APK build for VengaiCode's OWN mobile client
#  (apps/mobile), built with Gradle directly on the GitHub runner.
#
#  This is the EAS-free alternative to build-android-apk.yml. That
#  workflow only shells out to `eas build`, so it inherits Expo's
#  cloud build queue (observed sitting IN_QUEUE for 1h45m+ on the free
#  tier) and needs EAS_TOKEN/EXPO_TOKEN secrets that have never been
#  configured. This one runs `expo prebuild` + `gradlew` on
#  ubuntu-latest, which already ships the Android SDK and needs no
#  Expo account at all.
#
#  Both are kept: EAS remains the fallback (and the only path to
#  managed credentials / Play Store submission), this is the fast one.
#
#  apps/mobile is a MANAGED Expo project — there is no android/ dir in
#  the repo. `expo prebuild` generates it into the runner's workspace
#  each run and it is never committed, so the repo stays clean and the
#  native project can't drift from app.json.
#
#  Triggered manually only (workflow_dispatch) — this builds
#  VengaiCode's own product, so nothing in the backend should ever
#  dispatch it automatically. Same precedent as
#  build-desktop-windows.yml / build-desktop-linux.yml.
#
#  ── HONEST STATUS: written but UNTESTED end-to-end ──
#  No Android SDK in the dev environment this was authored in, so it
#  has never been run. Two things are the likely first failures:
#
#  1. pnpm + React Native autolinking. This workspace has no .npmrc,
#     so pnpm uses its default isolated (symlinked) node_modules.
#     expo-modules-autolinking supports that as of recent SDKs, but if
#     Gradle fails resolving native modules, the standard remedy is a
#     ROOT .npmrc containing `node-linker=hoisted` — note that changes
#     install layout for apps/desktop and the backend too, so it is
#     deliberately NOT done pre-emptively here.
#  2. Gradle heap. RN release builds are memory-hungry; GRADLE_OPTS
#     below raises it, but a runner OOM would show as a non-obvious
#     "Daemon disappeared" rather than a clean error.
#
#  ── Signing ──
#  Expo's generated android template signs the RELEASE variant with
#  its bundled debug keystore, so this produces an installable APK
#  with no secrets configured. That matches the current state of every
#  VengaiCode APK to date (all debug-signed). It is NOT Play
#  Store-publishable — that needs a real upload keystore, which is
#  tracked separately as the "Android release-signing secrets do not
#  exist" gap.
# ═══════════════════════════════════════════════════════════════

name: Build Android APK (Gradle, no EAS)
run-name: "Android APK (Gradle) — ${{ github.ref_name }} @ ${{ github.sha }}"

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Gradle build variant"
        type: choice
        options:
          - release
          - debug
        default: release

concurrency:
  group: android-gradle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-gradle:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@8.15.1 --activate

      # JDK 17 — required by React Native 0.81 / AGP 8.x. The runner's
      # default JDK has moved across image versions before, so it is
      # pinned rather than inherited.
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --no-install: pnpm already installed the workspace above, and
      # letting prebuild run its own npm/yarn install here would fight
      # the pnpm layout.
      - name: Generate native Android project (expo prebuild)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: apps/mobile/android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
        run: |
          set -euo pipefail
          VARIANT="${{ inputs.variant }}"
          # assembleRelease / assembleDebug — capitalize for the task name.
          TASK="assemble$(echo "${VARIANT:0:1}" | tr '[:lower:]' '[:upper:]')${VARIANT:1}"
          echo "Running ./gradlew $TASK"
          chmod +x ./gradlew
          ./gradlew "$TASK" --no-daemon --stacktrace

      # Resolve the path rather than hardcoding it: the output dir is
      # named after the variant, and a failed-but-exit-0 build would
      # otherwise upload an empty artifact silently.
      - name: Locate built APK
        id: apk
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -name '*.apk' -type f | head -1)"
          if [ -z "$APK" ]; then
            echo "No APK produced under app/build/outputs/apk" >&2
            exit 1
          fi
          echo "path=apps/mobile/android/$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vengaicode-android-${{ inputs.variant }}-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
