# ═══════════════════════════════════════════════════════════════
#  VengaiCode — Desktop App Linux Build (VengaiCode's OWN product)
#
#  NOT to be confused with build-linux-installer.yml, which packages
#  a per-project GENERATED app (fetched from the backend via
#  project_id) — this workflow builds VengaiCode's own fixed source
#  tree at apps/desktop into a real, installable Linux app, the same
#  way build-desktop-windows.yml builds the Windows counterpart.
#
#  Uses the repo's own pnpm/turborepo scripts (root package.json's
#  "build:desktop" -> `turbo run tauri:build --filter=@vengaicode/
#  desktop` -> `tauri build` inside apps/desktop), same as the
#  Windows workflow — only the runner OS and system dependencies
#  differ (webkit2gtk/gtk3 instead of WebView2).
#
#  VITE_API_URL is set to the deployed backend so the compiled app
#  talks to production, not localhost:8000 (api.ts's dev-only default)
#  — see tauri.conf.json's CSP, which explicitly allows this origin.
#
#  Triggered manually (workflow_dispatch) — this is a product release
#  build, not a per-user/per-project action, so nothing in the backend
#  ever dispatches this automatically.
#
#  HONEST STATUS: the Rust build and the .deb both work. Run 34221071093
#  compiled the release profile in 2m36s and bundled
#  vengai-code_1.0.0_amd64.deb, then died bundling the AppImage with
#  "error running appimage.sh" — see the env vars on the build step.
#  Earlier runs failed further back, and each fix is recorded where it
#  lives: the sidecar fetch step (34216456420) and binaries/README.md's
#  note on the per-platform resource split (34216459894). The AppImage
#  half is still unproven. macOS isn't attempted anywhere —
#  icons/icon.icns is an empty stub — that needs a real .icns first.
# ═══════════════════════════════════════════════════════════════
name: Build Desktop App (Linux)
run-name: "VengaiCode desktop Linux build — ${{ github.sha }}"

on:
  workflow_dispatch: {}

jobs:
  build-desktop-linux:
    # Pinned to 22.04 (not ubuntu-latest/24.04): Tauri CLI v1 needs
    # libwebkit2gtk-4.0-dev (webkit2gtk-soup2), which 24.04 dropped in
    # favor of libwebkit2gtk-4.1-dev (soup3) — only available on 22.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@8.15.1 --activate

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Portable AI engine sidecar ───────────────────────────────
      #  Same hard build dependency as the Windows workflow: tauri.conf
      #  .json declares "externalBin": ["binaries/llama-server"] for
      #  every target, and binaries/ is gitignored, so without this step
      #  `tauri build` dies with "path matching binaries/llama-server-
      #  x86_64-unknown-linux-gnu not found" before it links anything —
      #  exactly how the Windows workflow failed on run 34145311478.
      #
      #  Tag PINNED to match build-desktop-windows.yml. Both installers
      #  must ship the same inference engine; letting one drift means a
      #  bug reproduces on one OS and not the other.
      #
      #  The archive is searched rather than indexed by a fixed path:
      #  upstream does not treat the tarball's internal layout as a
      #  stable interface (the Windows zip is flat, the ubuntu tarball
      #  has historically nested under build/bin/), and a hardcoded
      #  guess here is a silent break on the next tag bump. Both finds
      #  are asserted, so a layout change fails loudly at this step
      #  instead of 20 minutes later in the bundler.
      #
      #  ubuntu-x64 (not vulkan/rocm/sycl): the sidecar has to start on
      #  any user's machine without a matching GPU runtime installed.
      - name: Fetch llama.cpp sidecar (portable AI engine)
        env:
          LLAMA_CPP_TAG: b10840
        run: |
          set -euo pipefail
          tag="$LLAMA_CPP_TAG"
          work="$RUNNER_TEMP/llama"
          archive="$RUNNER_TEMP/llama.tar.gz"
          url="https://github.com/ggml-org/llama.cpp/releases/download/$tag/llama-$tag-bin-ubuntu-x64.tar.gz"

          echo "Downloading $url"
          curl -fsSL "$url" -o "$archive"
          mkdir -p "$work"
          tar -xzf "$archive" -C "$work"

          dest="apps/desktop/src-tauri/binaries"
          mkdir -p "$dest"

          # Tauri appends the target triple to externalBin at build time,
          # so the file on disk must already carry it.
          src="$(find "$work" -type f -name 'llama-server' | head -n 1)"
          if [ -z "$src" ]; then
            echo "::error::llama-server not found in $url - archive layout changed"
            exit 1
          fi
          cp "$src" "$dest/llama-server-x86_64-unknown-linux-gnu"
          chmod +x "$dest/llama-server-x86_64-unknown-linux-gnu"

          # llama-server is a thin launcher; the engine lives in the
          # shared objects beside it (libllama, libggml-base, and the
          # ggml-cpu-* variants picked at runtime). Copied wholesale for
          # the same reason as the Windows DLLs: a trimmed set that
          # guesses wrong is a silent runtime load failure in the
          # shipped app, and nobody here can test it on Linux.
          find "$work" -type f -name '*.so*' -exec cp -P {} "$dest/" \;

          libs="$(find "$dest" -maxdepth 1 -name '*.so*' | wc -l)"
          if [ "$libs" -lt 1 ]; then
            echo "::error::no shared libraries copied - archive layout changed"
            exit 1
          fi
          find "$dest" -maxdepth 1 -name "*.so*" -printf "  %f\n" | sort
          echo "Sidecar ready: llama-server + $libs shared libs (llama.cpp $tag)"

      # ── deb succeeds; the AppImage needed the sidecar's libs found ──
      #  linuxdeploy walks the ELF dependencies of everything in the
      #  AppDir. llama-server is a thin launcher linked against
      #  libllama-server-impl.so, and Tauri puts externalBin in
      #  AppDir/usr/bin but resources in a separate resource dir — so
      #  linuxdeploy saw the launcher, went looking for its library, and
      #  failed with "Could not find dependency: libllama-server-impl.so"
      #  (runs 34221071093, 34222255293, 34222805673).
      #
      #  LD_LIBRARY_PATH points it at the staging dir the sidecar step
      #  filled. linuxdeploy then resolves those libraries and deploys
      #  them into AppDir/usr/lib, which is on the AppImage's runtime
      #  search path — so this fixes the build and the runtime lookup
      #  together, rather than just silencing the bundler.
      #
      #  Caveat worth knowing: this only covers libraries llama-server is
      #  LINKED against. The ggml-cpu-* variants are dlopen'd by name at
      #  runtime, so linuxdeploy cannot see them; those ride along via
      #  bundle.resources in tauri.linux.conf.json. Nobody here can run a
      #  Linux desktop to confirm the sidecar actually starts inside the
      #  finished AppImage — a green build is not that proof.
      #
      #  APPIMAGE_EXTRACT_AND_RUN / NO_STRIP were set while diagnosing
      #  this and kept: linuxdeploy and appimagetool are AppImages
      #  themselves and runners have no FUSE to mount them.
      - name: Build Linux app (deb + AppImage)
        env:
          VITE_API_URL: https://vengaicode-backend.onrender.com
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
          LD_LIBRARY_PATH: ${{ github.workspace }}/apps/desktop/src-tauri/binaries
        run: pnpm run build:desktop

      # ── Why the AppImage failed ──────────────────────────────────
      #  "error running appimage.sh" is the whole message Tauri v1 gives
      #  you: it shells out to linuxdeploy and discards its stdout and
      #  stderr unless the CLI is verbose. Two runs (34221071093,
      #  34222255293) failed here with nothing to go on.
      #
      #  This only fires on failure, and re-bundles rather than
      #  rebuilding — target/release is already warm from the step above,
      #  so tauri skips compilation and goes straight to the bundler.
      #  Seconds, not minutes. --bundles appimage narrows it to the one
      #  format that broke; the deb is already built and uploaded.
      #
      #  Delete this step once the AppImage build is green and staying
      #  green — it exists to make a silent failure legible, not as
      #  permanent scaffolding.
      - name: Diagnose AppImage failure (verbose re-bundle)
        if: failure()
        working-directory: apps/desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
          LD_LIBRARY_PATH: ${{ github.workspace }}/apps/desktop/src-tauri/binaries
        run: pnpm exec tauri build --verbose --bundles appimage 2>&1 | tail -120

      # always(): the deb bundles before the AppImage does, so when only
      # the AppImage step fails the deb is sitting there complete. Without
      # this the job throws away a working package on its way out. The job
      # still reports failure — this only salvages the artifact.
      - name: Upload .deb artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vengaicode-desktop-linux-deb
          path: apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: vengaicode-desktop-linux-appimage
          path: apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
