# ═══════════════════════════════════════════════════════════════
#  VengaiCode — Backend CI (lint + unit tests)
#
#  Runs on every push/PR touching apps/backend so a broken commit is
#  caught BEFORE Render's auto-deploy-on-push picks it up — previously
#  nothing gated that deploy at all: two real test files existed
#  (tests/unit/test_export.py, test_stack_matrix_adapters.py) but no
#  workflow ever ran them, and pytest wasn't even declared as a
#  dependency anywhere.
#
#  Two checks, both fast (no DB/services needed — these are pure unit
#  tests and static analysis):
#    - ruff check: lint, using the repo-root ruff.toml (same tool/config
#      lint-staged already calls locally per root package.json, and the
#      same one .pre-commit-config.yaml runs at commit time — this is
#      the backstop for anyone who commits with --no-verify).
#    - pytest: the actual unit test suite.
#
#  The suite also BUILDS AND RUNS what the no-AI generator writes for
#  backends in languages other than Python, with that language's real
#  toolchain (tests/unit/test_gin_e2e.py: go mod tidy, gofmt, go vet,
#  go build; test_aspnet_e2e.py: dotnet build with warnings as errors;
#  test_rails_e2e.py: bundle install, rails db:migrate, rails server;
#  test_laravel_e2e.py: composer install, php -l, artisan migrate,
#  artisan serve; test_rust_e2e.py: cargo build of the Actix Web and the
#  Axum crate with warnings as errors; then each server against a real
#  SQLite file) — and the generated frontends (test_frontend_build_e2e.py:
#  npm install and `npm run build` of every frontend the generator
#  writes — Vite for React, Vue, Svelte and plain HTML/JS, the Angular
#  CLI for Angular — on the Node release the installer workflows use).
#  Those tests
#  skip on a machine without the toolchain; VENGAI_REQUIRE_TOOLCHAINS
#  below turns a missing one into a failure here, so "skipped" can never
#  pass for "verified". Go is pinned to the version the installer
#  workflows build the desktop sidecar with (and go.mod declares); .NET
#  to the release the generated project file targets; PHP to the oldest
#  release the generated composer.json accepts; Rust is stable, as in the
#  installer workflows.
# ═══════════════════════════════════════════════════════════════

name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "ruff.toml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "apps/backend/**"
      - "ruff.toml"
      - ".github/workflows/backend-ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VENGAI_REQUIRE_TOOLCHAINS: go,dotnet,ruby,php,rust,node
      # Where the generated Rails app's gems go: one cached install, shared
      # by every project the tests generate.
      BUNDLE_PATH: /home/runner/.bundle-generated
      # And the generated Laravel app's Composer downloads.
      COMPOSER_CACHE_DIR: /home/runner/.composer-generated
      # And what the generated Rust crates compile into (their Cargo target
      # directory is VENGAI_E2E_CACHE/cargo-target).
      VENGAI_E2E_CACHE: /home/runner/.vengai-e2e
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: apps/backend
        run: pip install -r requirements-dev.txt

      - name: Set up Go (builds the generated Gin backend)
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: false

      # The generated project's modules and their compiled packages (SQLite
      # alone takes a minute or two to compile). Keyed on the file that
      # pins the versions.
      - name: Cache Go modules and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: generated-go-${{ runner.os }}-${{ hashFiles('apps/backend/app/ai/codegen_gin.py') }}
          restore-keys: generated-go-${{ runner.os }}-

      - name: Set up .NET (builds the generated ASP.NET Core backend)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: generated-nuget-${{ runner.os }}-${{ hashFiles('apps/backend/app/ai/codegen_aspnet.py') }}
          restore-keys: generated-nuget-${{ runner.os }}-

      - name: Set up Ruby (runs the generated Rails backend)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Cache the generated Rails app's gems
        uses: actions/cache@v4
        with:
          path: /home/runner/.bundle-generated
          key: generated-gems-${{ runner.os }}-${{ hashFiles('apps/backend/app/ai/codegen_rails.py') }}
          restore-keys: generated-gems-${{ runner.os }}-

      - name: Set up PHP and Composer (runs the generated Laravel backend)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, sqlite3, mbstring, pcntl
          tools: composer
          coverage: none

      - name: Cache the generated Laravel app's packages
        uses: actions/cache@v4
        with:
          path: /home/runner/.composer-generated
          key: generated-composer-${{ runner.os }}-${{ hashFiles('apps/backend/app/ai/codegen_laravel.py') }}
          restore-keys: generated-composer-${{ runner.os }}-

      - name: Set up Rust (builds the generated Actix Web and Axum backends)
        id: rust
        uses: dtolnay/rust-toolchain@stable

      # The generated crates' dependencies, downloaded and compiled (sqlx
      # with its bundled SQLite, tokio, actix-web, axum: minutes from
      # nothing, seconds from here). Keyed on the compiler, whose every
      # release recompiles all of it, and on the files that name the crates.
      - name: Cache the generated Rust apps' crates and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            /home/runner/.vengai-e2e/cargo-target
          key: generated-rust-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('apps/backend/app/ai/codegen_rust.py', 'apps/backend/app/ai/codegen/backend/rust_common.py', 'apps/backend/app/ai/codegen/backend/actix.py', 'apps/backend/app/ai/codegen/backend/axum.py') }}
          restore-keys: generated-rust-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-

      - name: Set up Node (builds every generated frontend)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The generated frontends' packages, as npm downloaded them. Keyed on
      # the files that name the packages.
      - name: Cache the generated frontends' npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: generated-npm-${{ runner.os }}-${{ hashFiles('apps/backend/app/ai/codegen/frontend/*.py', 'apps/backend/app/ai/codegen/manifests/*.py') }}
          restore-keys: generated-npm-${{ runner.os }}-

      - name: Lint (ruff)
        run: ruff check apps/backend/app

      - name: Run unit tests (pytest)
        working-directory: apps/backend
        run: pytest tests/ -v
