# VengaiCode pre-commit hooks.
#
# One-time setup (each dev does this once):
#   pip install pre-commit
#   pre-commit install
# After that, these hooks run automatically on `git commit`, only against
# the files you've staged — they don't touch or reformat the whole repo.
#
# This was an empty file before — present in the repo but wired to
# nothing. Root package.json's `lint-staged` config already declares the
# SAME intent (ruff for *.py, prettier for *.{json,md,yaml,yml}) via
# Husky, but `.husky/pre-commit` was never actually created, so neither
# mechanism did anything. This file is the one now doing the real work;
# it isn't required to also finish wiring Husky/lint-staged, since having
# both fully wired would just be two hook systems fighting over the same
# job.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-ast
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^apps/backend/
      - id: ruff-format
        files: ^apps/backend/
        # The deliberate one-time repo-wide reformat (96 of 121 backend
        # files) this hook was waiting on landed in its own dedicated
        # commit — see that commit's message. Safe to enable now: no
        # unrelated commit will carry a surprise reformat diff anymore,
        # since the codebase is already at ruff-format's target style.

  - repo: local
    hooks:
      - id: prettier
        name: prettier (JS/TS/JSON/MD/YAML)
        description: Uses the repo's own pnpm-installed prettier — no separate install.
        entry: npx --no-install prettier --write
        language: system
        files: \.(js|jsx|ts|tsx|json|md|ya?ml)$
        exclude: ^apps/backend/

      - id: eslint-desktop
        name: eslint (apps/desktop)
        description: >
          apps/desktop/.eslintrc.js used to be a 0-byte stub — this ran
          against nothing until a real config existed. Scoped to desktop
          only: mobile's lint runs through `expo lint`, a project-wide
          Expo CLI command rather than a per-file ESLint invocation, so
          it doesn't fit this staged-files hook model the same way.
          Lints the whole apps/desktop/src tree rather than just the
          staged files — pre-commit hands a hook repo-root-relative
          paths, which stop resolving once this `cd`s into apps/desktop,
          and the whole-tree run is the exact command already verified
          working (`cd apps/desktop && eslint src --ext .ts,.tsx`).
        entry: bash -c 'cd apps/desktop && npx --no-install eslint src --ext .ts,.tsx'
        language: system
        files: ^apps/desktop/src/.*\.(ts|tsx)$
        pass_filenames: false
