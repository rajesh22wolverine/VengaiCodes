# ═══════════════════════════════════════════════════════════════
#  VengaiCode — Mobile CI (typecheck + unit tests)
#
#  Counterpart to backend-ci.yml and desktop-ci.yml for apps/mobile,
#  which previously had no test runner declared at all — not even a
#  "test" script.
#
#  Runner choice: vitest, not jest-expo. Everything covered here is pure
#  logic, reducers, or axios wiring, none of which renders a React Native
#  component or touches the native runtime, so the Expo/Metro test stack
#  buys nothing and costs a far heavier install. Real component tests
#  (rendering a screen, firing a press) WOULD need jest-expo plus
#  @testing-library/react-native, added alongside this rather than
#  instead of it.
#
#  expo-secure-store / AsyncStorage are mocked at the src/lib/storage
#  module boundary so this runs in plain node with no emulator.
# ═══════════════════════════════════════════════════════════════

name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"
      # A dependency change anywhere in the workspace changes what's
      # installed (and hoisted) for this app too.
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc)
        working-directory: apps/mobile
        run: npx tsc --noEmit

      # tsconfig.json pins React's types to this app's own @types/react (19).
      # The workspace also has 18 (apps/desktop), and which copy pnpm hoists
      # isn't fixed — so a second copy in the program would make the
      # typecheck above pass or fail at random.
      - name: One copy of React's types
        working-directory: apps/mobile
        run: |
          own="@types+react@$(node -p "require('./node_modules/@types/react/package.json').version")"
          found=$(npx tsc --listFilesOnly | grep -oE '@types\+react@[0-9.]+' | sort -u)
          echo "this app's: $own"
          echo "in the program: $found"
          test "$found" = "$own"

      - name: Run unit tests (vitest)
        working-directory: apps/mobile
        run: npx vitest run
