[package]
name = "vengaicode-desktop"
version = "1.0.0"
description = "VengaiCode desktop app"
authors = ["VengaiCode"]
license = ""
repository = "https://github.com/rajesh22wolverine/VengaiCodes"
edition = "2021"
rust-version = "1.75"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = ["shell-open", "shell-execute", "shell-sidecar"] }
sysinfo = "0.39"
tokio = { version = "1", features = ["time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[features]
# This feature is used for production builds where `devPath` points to the
# filesystem and the built-in dev server is not used.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
