[pytest]
# Without this, `pytest` (the bare console-script entry point, as opposed
# to `python -m pytest`) doesn't add this directory to sys.path, so
# `import app.xxx` fails with "ModuleNotFoundError: No module named 'app'"
# — confirmed by reproducing it locally, and almost certainly why
# backend-ci.yml's first real run failed even though `python -m pytest`
# (what was actually used to verify these tests locally beforehand)
# worked fine. `pythonpath` (pytest 7+) fixes this regardless of which
# way pytest gets invoked, rather than only fixing this one CI workflow.
pythonpath = .
testpaths = tests
